server:
  port: 7670

spring:
  profiles:
    active: default
    include:
      - common
      - mysql
      - mongodb
      - client-api

  output:
    ansi:
      enabled: always

# 첨부파일 내려받기는 본문을 로그용으로 메모리에 복사하지 않는다 (스트리밍)
chat:
  logging:
    skip-body-paths: /v1/private/api/file/**

# 메트릭 : /actuator/health, /actuator/prometheus (api-gateway 는 /v1/**, /websocket/** 만 라우팅하므로 밖으로 노출되지 않는다)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
