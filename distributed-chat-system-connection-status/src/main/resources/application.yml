server:
  port: 7680

spring:
  profiles:
    active: default
    include:
      - common
      - mysql
      - redis
      - connection-status

  output:
    ansi:
      enabled: always

# 메트릭 : /actuator/health, /actuator/prometheus (api-gateway 는 /v1/**, /websocket/** 만 라우팅하므로 밖으로 노출되지 않는다)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
