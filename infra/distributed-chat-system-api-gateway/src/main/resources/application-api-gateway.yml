spring:
  config:
    activate:
      on-profile: default

  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    loadbalancer:
      cache:
        ttl: 5s # Eureka 목록 위에 한 번 더 캐시하는 시간 (default 35s)
    gateway:
      routes:
        # 접속 상태 / 알림 API 는 각 서버로. client-api 의 /v1/** 보다 먼저 와야 한다 (위에서부터 첫 번째로 맞는 라우트를 탄다)
        - id: connection-status
          uri: lb://CONNECTION-STATUS
          predicates:
            - Path=/v1/private/api/presence/**
        - id: notification
          uri: lb://NOTIFICATION
          predicates:
            - Path=/v1/private/api/notification/**
        - id: client-api
          uri: lb://CLIENT-API
          predicates:
            - Path=/v1/**
        - id: chatting
          uri: lb:ws://CHATTING
          predicates:
            - Path=/websocket/**
          filters:
            - name: ChattingRoutingFilter

eureka:
  client:
    registry-fetch-interval-seconds: 5 # 채팅 서버가 죽으면 빨리 라우팅 대상에서 빼기 위해 (default 30s)
    service-url:
      defaultZone: http://localhost:7710/eureka/

  instance:
#    lease-renewal-interval-in-seconds: 5 # 하트비트가 수신되지 않으면 서비스 등록 해제 (default: 30s)
#    lease-expiration-duration-in-seconds: 15 # 하트비트가 수신되지 않으면 서비스 등록 해제 (default: 90s)

---

spring:
  config:
    activate:
      on-profile: docker

  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    loadbalancer:
      cache:
        ttl: 5s # Eureka 목록 위에 한 번 더 캐시하는 시간 (default 35s)
    gateway:
      routes:
        # 접속 상태 / 알림 API 는 각 서버로. client-api 의 /v1/** 보다 먼저 와야 한다 (위에서부터 첫 번째로 맞는 라우트를 탄다)
        - id: connection-status
          uri: lb://CONNECTION-STATUS
          predicates:
            - Path=/v1/private/api/presence/**
        - id: notification
          uri: lb://NOTIFICATION
          predicates:
            - Path=/v1/private/api/notification/**
        - id: client-api
          uri: lb://CLIENT-API
          predicates:
            - Path=/v1/**
        - id: chatting
          uri: lb:ws://CHATTING
          predicates:
            - Path=/websocket/**
          filters:
            - name: ChattingRoutingFilter

eureka:
  client:
    registry-fetch-interval-seconds: 5 # 채팅 서버가 죽으면 빨리 라우팅 대상에서 빼기 위해 (default 30s)
    service-url:
      defaultZone: http://service-discovery:7710/eureka/

  instance:
    prefer-ip-address: true # 컨테이너 hostname 은 다른 컨테이너에서 resolve 되지 않으므로 IP 로 등록
#    lease-renewal-interval-in-seconds: 5 # 하트비트가 수신되지 않으면 서비스 등록 해제 (default: 30s)
#    lease-expiration-duration-in-seconds: 15 # 하트비트가 수신되지 않으면 서비스 등록 해제 (default: 90s)

---

spring:
  config:
    activate:
      on-profile: dev

---

spring:
  config:
    activate:
      on-profile: stage

