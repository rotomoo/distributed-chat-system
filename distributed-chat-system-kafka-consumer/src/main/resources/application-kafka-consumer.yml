spring:
  config:
    activate:
      on-profile: default

  kafka:
    bootstrap-servers:
      - localhost:9194
    consumer:
      group-id: chat-group-1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

---

spring:
  config:
    activate:
      on-profile: docker

  kafka:
    bootstrap-servers:
      - kafka-1:9192
    consumer:
      group-id: chat-group-1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

---

spring:
  config:
    activate:
      on-profile: dev

---

spring:
  config:
    activate:
      on-profile: stage

---

spring:
  config:
    activate:
      on-profile: prod
