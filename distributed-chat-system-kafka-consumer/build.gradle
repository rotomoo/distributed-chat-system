dependencies {
    implementation project(':common:distributed-chat-system-common')
    implementation project(':infra:distributed-chat-system-mongodb')

    // kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // mongodb
    compileOnly('org.springframework.boot:spring-boot-starter-data-mongodb')
    testImplementation('org.springframework.boot:spring-boot-starter-data-mongodb')

    // redis
    implementation('org.springframework.boot:spring-boot-starter-data-redis')

    // eureka-client : 채팅 서버 목록 조회 (등록은 하지 않음)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // feignClient : 채팅 서버로 메시지 전달
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.2.1'

    // 메트릭 (/actuator/prometheus). Kafka 클라이언트 메트릭(consumer lag 등)도 여기에 붙는다
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 재시도 토픽 / DLT 통합 테스트 (Kafka 는 진짜 브로커를 테스트 안에 띄운다)
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}
