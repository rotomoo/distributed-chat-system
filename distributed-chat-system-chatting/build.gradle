dependencies {
    implementation project(':common:distributed-chat-system-common')
    implementation project(':infra:distributed-chat-system-redis')

    // webSocket
    implementation('org.springframework.boot:spring-boot-starter-websocket')

    // security
    implementation('org.springframework.boot:spring-boot-starter-security')
    testImplementation('org.springframework.security:spring-security-test')

    // ObjectId 형식 검사 (메시지 / 첨부파일 ID). MongoDB 에는 붙지 않는다
    implementation 'org.mongodb:bson'

    // redis
    compileOnly('org.springframework.boot:spring-boot-starter-data-redis')
    testImplementation('org.springframework.boot:spring-boot-starter-data-redis')
    // 통합 테스트에서 로그인 세션(Spring Session)을 직접 만든다
    testImplementation('org.springframework.session:spring-session-data-redis')

    // eureka-client
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // feignClient
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.2.1'

    // 메트릭 (/actuator/prometheus)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
}