syntax = "proto3";

package protobuf;

message ChatMessage {
  int64 send_user_id = 1;
  int64 channel_id = 2;
  string message = 3;
  int64 publish_dt = 4; // epoch millis
  repeated string attachment_file_ids = 5; // 업로드한 파일 ID (GridFS). 이름/형식/크기는 컨슈머가 GridFS 에서 채운다
  string event_id = 6; // 채팅 서버가 발행할 때 만든 UUID. 컨슈머가 이 값으로 한 번만 저장한다 (재시도 / 중복 발행에도 문서 1개)
}

// 컨슈머가 GridFS metadata 로 확인한 첨부파일
message Attachment {
  string file_id = 1;
  string name = 2;
  string content_type = 3;
  int64 size = 4;
}

// 컨슈머 -> 채팅 서버 : 해당 채팅 서버에 접속한 수신자에게 전달할 메시지
message ChatMessageDelivery {
  string message_id = 1;
  ChatMessage chat_message = 2;
  repeated int64 receive_user_ids = 3;
  repeated Attachment attachments = 4; // 검증을 통과한 첨부만 (chat_message.attachment_file_ids 는 클라이언트가 보낸 값)
}

// 채팅 서버 -> 프로듀서 -> 컨슈머 : 이모지 리액션 추가/제거 (토픽 chat-reaction, key = channel_id)
message ChatReaction {
  enum Action {
    ACTION_UNSPECIFIED = 0; // proto3 기본값. 컨슈머는 버린다
    ADD = 1;
    REMOVE = 2;
  }

  int64 send_user_id = 1;
  int64 channel_id = 2;
  string message_id = 3;
  string emoji = 4;
  Action action = 5;
  int64 publish_dt = 6; // epoch millis
}

// 메시지의 이모지 하나와 누른 사람들 (개수 = user_ids 길이)
message Reaction {
  string emoji = 1;
  repeated int64 user_ids = 2;
}

// 컨슈머 -> 채팅 서버 : 바뀐 뒤의 그 메시지 리액션 전체
message ChatReactionDelivery {
  string message_id = 1;
  int64 channel_id = 2;
  repeated Reaction reactions = 3;
  repeated int64 receive_user_ids = 4;
}

// 컨슈머 -> 알림 서버 : 오프라인 멤버(접속 위치 없음 / 죽은 서버)에게 웹 푸시 (토픽 chat-notification, key = channel_id)
// 보낸 사람은 빠진다. 받는 사람이 많으면 500명씩 나눠 여러 건으로 보낸다. 리액션은 알림을 만들지 않는다
message ChatNotification {
  string message_id = 1;
  int64 channel_id = 2;
  int64 sender_id = 3;
  string preview = 4; // 본문 앞 100자 (코드 포인트 기준, 이모지가 잘리지 않게)
  int32 attachment_count = 5; // 확인된 첨부 수 (본문 없이 첨부만이면 알림 본문이 "파일 N개")
  int64 publish_dt = 6; // epoch millis (채팅 서버가 받은 시각)
  repeated int64 receiver_user_ids = 7;
}
