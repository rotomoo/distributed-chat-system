name: CI

# main 은 deploy.yml 이 이 워크플로를 호출해서 돌린다 (중복 실행 방지)
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # 통합 테스트(default 프로필)가 localhost 의 mysql / mongodb / redis 를 쓴다.
    # 잡이 끝나면 사라지는 일회용 컨테이너라 아래 값들은 비밀이 아니다 (운영 값은 서버의 .env).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: chat
          MYSQL_USER: chat
          MYSQL_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uchat -pci-only"
          --health-interval=5s --health-timeout=3s --health-retries=30
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
      # client-api 통합 테스트의 세션 저장소
      redis:
        image: redis:6.2
        ports: ["6379:6379"]
    env:
      DB_USERNAME: chat
      DB_PASSWORD: ci-only
      # 테스트는 ENC() 값을 쓰지 않는다. 키가 주입되는지만 확인하므로 일회용 값으로 충분
      jasypt_encryptor_password: ci-only-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      # build = 컴파일 + 프론트(vite) 빌드 + 테스트
      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
