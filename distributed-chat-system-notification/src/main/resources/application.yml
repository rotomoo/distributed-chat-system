server:
  port: 7690

spring:
  profiles:
    active: default
    include:
      - common
      - mysql
      - redis
      - notification

  output:
    ansi:
      enabled: always

chat:
  notification:
    # VAPID 키 : 환경변수가 있으면 그 값, 없으면 처음 뜰 때 만들어 MySQL vapid_key 에 저장하고 계속 그 값을 쓴다 (VapidKeyLoader)
    # 공개키 / 개인키는 함께 설정해야 한다. subject 는 푸시 서비스가 문제 있을 때 연락할 곳 (mailto: 또는 https:)
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:admin@example.com}
    push:
      ttl-seconds: 86400 # 기기가 꺼져 있으면 푸시 서비스가 하루까지 보관 (지난 채팅 알림은 의미가 적다)
      connect-timeout-ms: 3000
      request-timeout-ms: 5000
      # 구독 endpoint 로 허용하는 푸시 서비스 호스트 (점으로 시작하면 하위 도메인). 아무 URL 로나 POST 하지 않게 (SSRF)
      allowed-endpoint-hosts: fcm.googleapis.com,updates.push.services.mozilla.com,.push.apple.com,.notify.windows.com
      allow-insecure-endpoint: false # true 면 http:// endpoint 허용 (테스트용)
    # 재시도 토픽 : 짧게 몇 번만. 끝내 실패하면 DLT 에서 로그만 남기고 버린다 (알림은 유실 허용)
    retry:
      delay-ms: 2000
      max-attempts: 3
      topic-partitions: 3

# 메트릭 : /actuator/health, /actuator/prometheus (api-gateway 는 /v1/**, /websocket/** 만 라우팅하므로 밖으로 노출되지 않는다)
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
