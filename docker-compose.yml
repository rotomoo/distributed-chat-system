# 전체 스택: docker compose up -d --build  →  http://localhost:8080
#
# secret 은 레포에 두지 않는다. .env.example 을 .env 로 복사해서 채운 뒤 실행 (.env 는 git 미추적)
#
# 앱 서비스는 루트 Dockerfile 하나를 공유하고 MODULE 로 어떤 jar 를 띄울지 고른다.

x-app: &app
  restart: on-failure
  environment: &app-env
    spring_profiles_active: docker
    jasypt_encryptor_password: ${JASYPT_ENCRYPTOR_PASSWORD:?.env 에 JASYPT_ENCRYPTOR_PASSWORD 를 설정하세요}
    DB_USERNAME: ${DB_USERNAME:-chat}
    DB_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
    JAVA_OPTS: -Xmx256m
  depends_on: &app-depends
    service-discovery:
      condition: service_started
    redis-sentinel:
      condition: service_started

services:
  # ── redis : master 1 + replica 2 + sentinel 3 ──────────────────
  redis:
    image: redis:6.2
    ports:
      - "6379:6379"

  redis-replica:
    image: redis:6.2
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis 6379
    depends_on: [redis]

  redis-replica2:
    image: redis:6.2
    ports:
      - "6381:6379"
    command: redis-server --replicaof redis 6379
    depends_on: [redis]

  # sentinel 은 실행 중 자기 설정 파일을 다시 쓴다(CONFIG REWRITE).
  # 레포의 conf 를 직접 물리면 컨테이너 IP 가 박힌 채 커밋되므로, 컨테이너 안으로 복사해서 띄운다.
  redis-sentinel: &sentinel
    image: redis:6.2
    ports:
      - "26379:26379"
    volumes:
      - ./conf/sentinel.conf:/conf/sentinel.conf:ro
    command: sh -c "cp /conf/sentinel.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    depends_on: [redis, redis-replica, redis-replica2]

  redis-sentinel2:
    <<: *sentinel
    ports:
      - "26380:26379"

  redis-sentinel3:
    <<: *sentinel
    ports:
      - "26381:26379"

  # ── db ─────────────────────────────────────────────────────────
  mysql-container:
    image: mysql:8.0
    ports:
      - "3306:3306"
    # 앱은 root 가 아닌 전용 계정(DB_USERNAME)으로 chat 스키마에만 접근
    # root 비밀번호는 아무도 쓰지 않으므로 컨테이너가 무작위로 만든다 (로그에 한 번 출력됨)
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: chat
      MYSQL_USER: ${DB_USERNAME:-chat}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"

  # ── kafka (KRaft 단일 노드) ─────────────────────────────────────
  # 컨테이너끼리는 kafka-1:9192, 호스트(IDE 실행)에서는 localhost:9194
  kafka-1:
    image: apache/kafka:3.9.0
    ports:
      - "9194:9194"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9192,CONTROLLER://:9193,EXTERNAL://:9194
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9192,EXTERNAL://localhost:9194
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@localhost:9193
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "7081:8080"
    depends_on: [kafka-1]
    environment:
      KAFKA_CLUSTERS_0_NAME: chat-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9192

  # ── spring cloud ───────────────────────────────────────────────
  service-discovery:
    <<: *app
    build:
      context: .
      args:
        MODULE: distributed-chat-system-service-discovery
    ports:
      - "7710:7710"
    depends_on:
      redis-sentinel:
        condition: service_started

  api-gateway:
    <<: *app
    build:
      context: .
      args:
        MODULE: distributed-chat-system-api-gateway
    ports:
      - "8080:8080"

  # ── 서비스 ─────────────────────────────────────────────────────
  client-api:
    <<: *app
    build:
      context: .
      args:
        MODULE: distributed-chat-system-client-api
    ports:
      - "7670:7670"
    environment:
      <<: *app-env
      # 웹 푸시 구독 API 가 브라우저에 주는 공개키 (notification 과 같은 값. 없으면 MySQL vapid_key 를 읽는다)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    depends_on:
      <<: *app-depends
      mysql-container:
        condition: service_healthy

  # 오프라인 수신자에게 웹 푸시 (chat-notification 토픽 소비). VAPID 키는 VAPID_* 환경변수, 없으면 처음 뜰 때 만들어 MySQL 에 고정
  notification-consumer:
    <<: *app
    build:
      context: .
      args:
        MODULE: distributed-chat-system-notification-consumer
    ports:
      - "7690:7690"
    environment:
      <<: *app-env
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      <<: *app-depends
      mysql-container:
        condition: service_healthy
      kafka-1:
        condition: service_started

  # 채팅 서버는 3대로 띄워 서버간 전달(컨슈머 경유)을 확인한다. 포트는 랜덤(server.port: 0)
  chatting-1: &chatting
    <<: *app
    build:
      context: .
      args:
        MODULE: distributed-chat-system-chatting
    environment:
      <<: *app-env
      # 웹소켓 연결을 메모리에 들고 있으므로 다른 서비스(256m)보다 크게 준다. 연결 데이터 400MB + Spring 기본 사용량
      JAVA_OPTS: -Xmx640m

  chatting-2: *chatting

  chatting-3: *chatting

  kafka-producer:
    <<: *app
    build:
      context: .
      args:
        MODULE: distributed-chat-system-kafka-producer
    depends_on:
      <<: *app-depends
      kafka-1:
        condition: service_started

  message-consumer:
    <<: *app
    build:
      context: .
      args:
        MODULE: distributed-chat-system-message-consumer
    depends_on:
      <<: *app-depends
      kafka-1:
        condition: service_started
      mongodb:
        condition: service_started
