spring:
  config:
    activate:
      on-profile: default

  application:
    name: notification-consumer

  kafka:
    bootstrap-servers:
      - localhost:9194
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer # 값 = 이벤트 JSON (common EventJson)
    # 재시도 / DLT 토픽으로 원래 레코드(JSON 문자열)를 그대로 다시 보낸다
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

---

spring:
  config:
    activate:
      on-profile: docker

  application:
    name: notification-consumer

  kafka:
    bootstrap-servers:
      - kafka-1:9192
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer # 값 = 이벤트 JSON (common EventJson)
    # 재시도 / DLT 토픽으로 원래 레코드(JSON 문자열)를 그대로 다시 보낸다
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

---

spring:
  config:
    activate:
      on-profile: dev

---

